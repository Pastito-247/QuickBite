server:
  port: 8084

spring:
  application:
    name: notificaciones-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/quickbite_notificaciones?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  cloud:
    eureka:
      client:
        service-url:
          defaultZone: http://localhost:8761/eureka/
      instance:
        prefer-ip-address: true
  
  # Caché Redis (opcional)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutos

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:quickbite-secret-key-for-jwt-signing-2024-notifications}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 horas

# Resilience4J Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      inventario-service:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        slidingWindowSize: 10
      pedido-service:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        failureRateThreshold: 60
        waitDurationInOpenState: 20s
        slidingWindowSize: 8

# Management & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,5s
    tags:
      application: ${spring.application.name}

# Distributed Tracing (Zipkin)
management.tracing:
  sampling:
    probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.ms_notificaciones.not: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.circuitbreaker: DEBUG
