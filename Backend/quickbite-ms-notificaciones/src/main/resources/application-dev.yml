server:
  port: 8084

spring:
  application:
    name: notificaciones-service
  
  # Deshabilitar base de datos para desarrollo
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true
  
  # Deshabilitar Eureka para desarrollo
  cloud:
    eureka:
      client:
        enabled: false

resilience4j:
  circuitbreaker:
    instances:
      inventario-service:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
      pedido-service:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ms_notificaciones.not: DEBUG
    org.springframework.cloud.circuitbreaker: DEBUG
