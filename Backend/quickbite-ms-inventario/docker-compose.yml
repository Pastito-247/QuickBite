version: '3.8'

services:
  mysql-inventory:
    image: mysql:8.0
    container_name: quickbite-mysql-inventory
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: quickbite_inventory
      MYSQL_USER: inventory_user
      MYSQL_PASSWORD: inventory_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_inventory_data:/var/lib/mysql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  inventory-service:
    build: .
    container_name: quickbite-inventory-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql-inventory
      - DB_PORT=3306
      - DB_NAME=quickbite_inventory
      - DB_USERNAME=inventory_user
      - DB_PASSWORD=inventory_pass
    depends_on:
      mysql-inventory:
        condition: service_healthy
    networks:
      - quickbite-network
    restart: unless-stopped

volumes:
  mysql_inventory_data:

networks:
  quickbite-network:
    driver: bridge
