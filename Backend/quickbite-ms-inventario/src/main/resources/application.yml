server:
  port: 8082
  servlet:
    context-path: /api/inventory

spring:
  application:
    name: inventory-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/quickbite_inventory?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:inventory_user}
    password: ${DB_PASSWORD:inventory_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration

# Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50

# Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    com.ms_inventario.inv: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# External Services
services:
  menu-service:
    url: http://localhost:8083/api/menu
  notification-service:
    url: http://localhost:8087/api/notifications
