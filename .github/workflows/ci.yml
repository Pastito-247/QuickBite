name: QuickBite CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - quickbite-Auth-main
          - quickbite-ms-inventario
          - quickbite-menu-service
          - quickbite-pedidos-main
          - quickbite-kitchen-service
          - quickbite-ms-notificaciones
          - quickbite-payment-service
          - eureka-server
          - api-gateway
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run tests for ${{ matrix.service }}
        run: |
          cd Backend/${{ matrix.service }}
          mvn clean test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: Backend/${{ matrix.service }}/target/surefire-reports/

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      
      - name: Run tests
        run: |
          cd frontend
          npm test -- --watchAll=false --coverage
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/

  build-backend:
    name: Build Backend Services
    runs-on: ubuntu-latest
    needs: [test-backend]
    
    strategy:
      matrix:
        service:
          - quickbite-Auth-main
          - quickbite-ms-inventario
          - quickbite-menu-service
          - quickbite-pedidos-main
          - quickbite-kitchen-service
          - quickbite-ms-notificaciones
          - quickbite-payment-service
          - eureka-server
          - api-gateway
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build ${{ matrix.service }}
        run: |
          cd Backend/${{ matrix.service }}
          mvn clean package -DskipTests
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: Backend/${{ matrix.service }}/target/*.jar

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    strategy:
      matrix:
        service:
          - quickbite-Auth-main
          - quickbite-ms-inventario
          - quickbite-menu-service
          - quickbite-pedidos-main
          - quickbite-kitchen-service
          - quickbite-ms-notificaciones
          - quickbite-payment-service
          - eureka-server
          - api-gateway
          - frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image for ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            docker build -t quickbite/${{ matrix.service }}:latest ./frontend
          else
            docker build -t quickbite/${{ matrix.service }}:latest ./Backend/${{ matrix.service }}
          fi
      
      - name: Save Docker image
        run: |
          docker save quickbite/${{ matrix.service }}:latest | gzip > ${{ matrix.service }}.tar.gz
      
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar.gz

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Run Checkstyle
        run: |
          cd Backend
          mvn checkstyle:check
      
      - name: Upload Checkstyle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-results
          path: Backend/target/checkstyle-results.xml
